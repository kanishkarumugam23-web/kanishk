<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FitTrack Pro</title>
<style>
:root{--bg:#0e1013;--card:#181c21;--line:#272d34;--tx:#e8ecef;--mu:#8a949e;--g:#b6ff3b;--o:#ff7a1a;--r:#ff5d5d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin-bottom:6px}h2{font-size:1.05rem;margin-bottom:10px}
.m{color:var(--mu)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
input,select{width:100%;background:#10141a;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin:6px 0 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
label{display:block;color:var(--mu);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--g);color:#0b1000;font-weight:700}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--line);text-align:left;padding:14px}
.opt.sel{border-color:var(--g)}.opt:disabled{opacity:.4;cursor:not-allowed}
.dots{display:flex;gap:6px;margin-bottom:22px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--g)}
.big{font-size:3.2rem;font-weight:800;line-height:1.1}
.tag{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;margin:6px 0;background:#2a3037}
.Underweight{color:#6cc4ff}.Normal{color:var(--g)}.Overweight{color:var(--o)}.Obese{color:var(--r)}
.err{color:var(--r);margin:8px 0}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--g);border-radius:6px}
.bar.o b{background:var(--o)}
.nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.nav .wrap{display:flex;gap:6px;align-items:center;padding:10px 16px}
.nav button{background:transparent;color:var(--mu);padding:8px 12px}.nav button.on{background:var(--card);color:var(--g)}
.nav span{margin-right:auto;font-weight:800;color:var(--g)}
.streak{font-size:2.2rem;font-weight:800;color:var(--o)}
.chip{display:inline-block;padding:7px 14px;margin:0 6px 8px 0;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--tx);font-weight:500}
.chip.on{background:var(--g);color:#0b1000;border-color:var(--g);font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.ok{color:var(--g)}.sc{color:#6cc4ff}.no{color:var(--r)}
svg{width:100%;height:auto;display:block}
.rf{transition:stroke-dashoffset 1.4s ease-out}.ring{width:130px;height:130px;flex:none}.rc{display:flex;gap:18px;align-items:center}
details{border-bottom:1px solid var(--line)}details:last-of-type{border:0}
summary{cursor:pointer;display:flex;gap:8px;padding:12px 0;list-style:none}summary::-webkit-details-marker{display:none}
summary span{margin-left:auto}summary::after{content:"+";color:var(--g);font-weight:800}details[open] summary::after{content:"-"}
details>div{padding-bottom:6px}
  acc{padding:0}.acc>.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;color:var(--tx);padding:16px;border-radius:14px;text-align:left;font-weight:400}
.acc>.ah::after{content:"+";color:var(--g);font-weight:800;font-size:1.4rem}.acc.open>.ah::after{content:"-"}
.acw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.acc.open .acw{grid-template-rows:1fr}
.acw>div{overflow:hidden;min-height:0}.acw>div>div{padding:0 16px 16px}
.wb{padding:8px 0;border-bottom:1px solid var(--line)}.wbt{display:flex;justify-content:space-between;gap:8px}
.wbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.wbar b{display:block;height:100%;background:var(--o);border-radius:6px}.wbar b.d{background:var(--g)}
textarea{width:100%;min-height:90px;background:#10141a;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin:6px 0 12px}
.nav .wrap{overflow-x:auto}.nav button{white-space:nowrap}@media(max-width:700px){.nav span{display:none}}

.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:560px){.mg{grid-template-columns:repeat(2,1fr)}}
.mc{background:var(--card);border:2px solid var(--line);color:var(--tx);padding:10px;text-align:center;font-weight:600}.mc.sel{border-color:var(--g)}.mc svg{width:56px;height:84px;margin:0 auto}
.ec{display:block;width:100%;text-align:left;background:#10141a;color:var(--tx);border:1px solid var(--line);margin-bottom:8px;font-weight:500}
.tm{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--line)}.tw{overflow-x:auto}
pre{white-space:pre-wrap;background:#10141a;border-radius:10px;padding:12px;margin:10px 0}
[hidden]{display:none!important}
.dy{border-bottom:1px solid var(--line)}.dy:last-child{border:0}.dh{display:flex;gap:8px;width:100%;background:transparent;color:var(--tx);padding:12px 0;font-weight:400;border-radius:0;text-align:left}.dh span{margin-left:auto}.dh::after{content:"+";color:var(--g);font-weight:800}.dy.open .dh::after{content:"-"}.dy.open .acw{grid-template-rows:1fr}.dy .acw>div>div{padding:0 0 10px}
.tl{position:relative;padding-left:46px}.tl::before{content:"";position:absolute;left:15px;top:14px;bottom:14px;width:3px;background:var(--line)}
.ex{position:relative;margin-bottom:14px}.dot{position:absolute;left:-46px;top:18px;width:32px;height:32px;border-radius:50%;background:#3a424b;display:flex;align-items:center;justify-content:center;color:#0b1000;font-weight:800}.dot.on{background:var(--g)}
.ec2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.ex.dn .ec2{border-color:var(--g)}
.eh{display:flex;gap:12px;align-items:flex-start}.eh svg{width:52px;height:78px;flex:none}.eh>div{flex:1}
.sh{display:flex;align-items:center;gap:10px;margin:18px 0 12px}.sh b{font-size:1.1rem}.sh .sp{margin-left:auto}
.fix{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 45%);z-index:6}.fix button{display:block;width:100%;max-width:728px;margin:0 auto;padding:15px}
body{font-size:17px;padding-bottom:84px}
input,select{min-height:48px;font-size:16px}
button{min-height:46px}button.sm{min-height:38px;padding:7px 12px}
.chip{padding:10px 16px;min-height:42px}.chip.sm{padding:8px 12px;font-size:.9rem;min-height:38px}
.top{max-width:760px;margin:0 auto;padding:14px 16px 0;display:flex;justify-content:space-between;align-items:center}.top b{color:var(--g);font-size:1.1rem}
.bn{position:fixed;left:0;right:0;bottom:0;background:#12161b;border-top:1px solid var(--line);display:flex;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.bn button{flex:1;background:transparent;color:var(--mu);border-radius:0;padding:8px 2px 6px;font-size:.7rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
.bn button.on{color:var(--g)}.bn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{bottom:84px}.fix{bottom:62px}
.ck{padding:12px 0;border-bottom:1px solid var(--line)}.ck:last-child{border:0}.ckt{display:flex;justify-content:space-between;gap:8px}.ck .row{margin-top:6px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.wd{text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:12px;background:var(--card)}.wd.on{border-color:var(--g)}.wd.t{background:#222a31}.wd span{display:block;font-size:.75rem;color:var(--mu)}
ol{padding-left:20px;margin:8px 0 12px}
.vl{display:inline-block;margin:0 10px 10px 0;padding:11px 18px;border:1px solid var(--line);border-radius:10px;color:var(--g);text-decoration:none;font-weight:700}
</style>

<script>
const KEY='fittrack_v1';
let S0=null;try{S0=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
let S=Object.assign({p:null,logs:{},wk:[],plan:{n:0,s:{}},mode:'steps',prot:'med',sleepGoal:8,waterGoal:3000,act:1.375},S0||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const bmi=(w,h)=>w/((h/100)**2);
const cat=b=>b<18.5?['Underweight',"Let's build up strength safely!"]:b<25?['Normal','Great job!']:b<30?['Overweight',"Let's work on a healthy plan!"]:['Obese',"Let's start a steady, healthy plan!"];
const PACE={loss:{slow:.25,mid:.5,fast:1},gain:{slow:.25,mid:.35,fast:.5}};
const PN={slow:'Slow (Safe & Sustainable)',mid:'Mid (Balanced)',fast:'Fast (Aggressive)'};
const MUSC=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core','Cardio'];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

'Lower Chest':'Decline Bench Press|Barbell|Slight decline, bar to lower chest;Chest Dips|Bodyweight|Lean forward and lower to a comfortable depth;High-to-Low Cable Fly|Cable|Bring hands from shoulders down to hips'},
Back:{'Lats (Width)':'Pull-ups|Bodyweight|Start from a dead hang and drive elbows down;Lat Pulldown|Cable|Chest up, pull the bar to upper chest;Straight-Arm Pulldown|Cable|Arms straight, sweep the bar to your thighs',

'Lateral Deltoid':'Lateral Raise|Dumbbell|Lead with the elbows up to shoulder height;Cable Lateral Raise|Cable|Keep tension and lift out to the side',

Biceps:{'Long Head':'Incline Dumbbell Curl|Dumbbell|Arms behind the torso for a deep stretch;Drag Curl|Barbell|Keep the bar close and elbows back',
'Short Head':'Preacher Curl|Machine|Upper arms flat on the pad, full stretch;Concentration Curl|Dumbbell|Elbow braced on the thigh, slow squeeze;Wide-Grip Barbell Curl|Barbell|Hands wider than shoulders, no swinging',
'Brachialis':'Hammer Curl|Dumbbell|Neutral grip, elbows pinned to your sides'},
Triceps:{'Long Head':'Overhead Triceps Extension|Dumbbell|Elbows close to the ears, full stretch;Skull Crushers|Barbell|Lower to the forehead, upper arms still',
'Lateral Head':'Triceps Pushdown|Cable|Elbows fixed at your sides, lock out;Close-Grip Bench Press|Barbell|Hands shoulder width, elbows tucked;Diamond Push-ups|Bodyweight|Hands together under the chest',
'Medial Head':'Reverse-Grip Pushdown|Cable|Palms up, keep elbows still;Bench Dips|Bodyweight|Keep the back close to the bench'},
Legs:{'Quads':'Squat|Barbell|Brace, sit between the hips, knees track the toes;Leg Press|Machine|Feet shoulder width, do not lock the knees;Leg Extension|Machine|Squeeze at the top, lower slowly;Bulgarian Split Squat|Dumbbell|Rear foot up, drop straight down',
'Hamstrings':'Romanian Deadlift|Barbell|Soft knees, push hips back, bar close;Leg Curl|Machine|Curl heels to glutes, slow lowering',
'Glutes':'Hip Thrust|Barbell|Chin tucked, drive through heels, pause at the top;Walking Lunges|Dumbbell|Long stride, torso upright;Step-ups|Dumbbell|Drive through the lead heel',

Back:{'Lats (Width)':'Close-Grip Pulldown|Cable|Neutral grip, pull to the upper chest;Assisted Pull-ups|Machine|Full hang to chin over the bar;Single-Arm Lat Pulldown|Cable|Pull the elbow down to the hip',
'Mid Back (Thickness)':'Chest-Supported Row|Dumbbell|Chest on the incline bench, pull to the hips;Inverted Row|Bodyweight|Body straight, pull the chest to the bar;Machine Row|Machine|Chest on the pad, squeeze at the end',
'Lower Back and Traps':'Rack Pull|Barbell|Bar from knee height, lock out with the glutes;Good Morning|Barbell|Hinge at the hips with soft knees;Barbell Shrugs|Barbell|Straight up, pause at the top'},
Shoulders:{'Front Deltoid':'Arnold Press|Dumbbell|Rotate palms from facing you to forward;Machine Shoulder Press|Machine|Seat so handles start at shoulder height;Plate Front Raise|Barbell|Hold a plate and raise to eye level',
'Lateral Deltoid':'Machine Lateral Raise|Machine|Lead with the elbows, no shrugging;Leaning Lateral Raise|Dumbbell|Lean away from a post for more range;Upright Row|Barbell|Pull to chest height with elbows high',
'Rear Deltoid':'Bent-Over Reverse Fly|Dumbbell|Hinge and open the arms wide;Cable Rear Delt Fly|Cable|Cross the cables and pull wide;Band Pull-Aparts|Bodyweight|Pull a band apart at chest height'},
Biceps:{'Long Head':'Standing Barbell Curl|Barbell|Elbows still, no swinging;Cable Curl|Cable|Constant tension, squeeze at the top;Spider Curl|Dumbbell|Chest on an incline bench, arms hanging',

Legs:{'Quads':'Goblet Squat|Dumbbell|Chest up, elbows between the knees;Hack Squat|Machine|Feet low on the platform for more quads;Sissy Squat|Bodyweight|Lean back and bend at the knees',
'Hamstrings':'Seated Leg Curl|Machine|Pads snug on the calves, slow lowering;Stiff-Leg Deadlift|Dumbbell|Soft knees, stretch the hamstrings;Nordic Curl|Bodyweight|Lower slowly and catch with the hands',
'Glutes':'Glute Bridge|Bodyweight|Drive hips up and squeeze;Cable Kickback|Cable|Kick back without arching the back;Reverse Lunge|Dumbbell|Step back, lower straight down',
'Calves':'Donkey Calf Raise|Machine|Hinge at the hips, full stretch;Single-Leg Calf Raise|Bodyweight|Hold a rail and rise on one foot;Leg Press Calf Raise|Machine|Only the ankles move'},
Core:{'Abs':'Reverse Crunch|Bodyweight|Curl the hips toward the ribs;Decline Sit-ups|Bodyweight|Controlled up and down, no yanking;Dead Bug|Bodyweight|Lower opposite arm and leg, back flat',
'Obliques':'Cable Woodchop|Cable|Rotate through the torso from high to low;Bicycle Crunch|Bodyweight|Elbow to opposite knee;Suitcase Carry|Dumbbell|Walk tall holding one heavy dumbbell',
'Deep Core':'Hollow Hold|Bodyweight|Lower back pressed into the floor;Pallof Press|Cable|Resist the rotation as you press out;Bird Dog|Bodyweight|Extend opposite arm and leg slowly'},

Object.entries(EXT).forEach(([m,hs])=>Object.entries(hs).forEach(([h,t])=>{EXD[m][h]+=';'+t}));
const EXL=[];Object.entries(EXD).forEach(([m,hs])=>Object.entries(hs).forEach(([h,str])=>str.split(';').forEach(t=>{const[n,eq,cue]=t.split('|');EXL.push({n,eq,cue,m,h})})));
const EX={};MUSC.forEach(m=>EX[m]=EXL.filter(x=>x.m==m).map(x=>x.n));
const EQH={Barbell:'Load the bar evenly, set your feet and grip, brace your core, then move through a full controlled range.',Dumbbell:'Pick a weight you can control, keep your wrists straight, and lower for about 2 seconds before lifting.',Cable:'Set the pulley to the right height, keep tension on the cable for the whole rep, and avoid swinging.',Machine:'Adjust the seat and pads so your joint lines up with the pivot, and move smoothly without hard lockouts.',Bodyweight:'Keep your body in a stable line and use a full range of motion at a steady pace.'};
const IC={Chest:'<ellipse cx="30" cy="31" rx="12" ry="6"/>',Back:'<path d="M18 24L42 24L38 52L22 52Z"/>',Shoulders:'<circle cx="14" cy="26" r="6"/><circle cx="46" cy="26" r="6"/>',Biceps:'<rect x="6" y="32" width="8" height="12" rx="3"/><rect x="46" y="32" width="8" height="12" rx="3"/>',Triceps:'<rect x="6" y="46" width="8" height="12" rx="3"/><rect x="46" y="46" width="8" height="12" rx="3"/>',Legs:'<rect x="18" y="60" width="10" height="26" rx="4"/><rect x="32" y="60" width="10" height="26" rx="4"/>',Core:'<rect x="22" y="40" width="16" height="14" rx="3"/>',Cardio:'<path d="M30 54C14 42 22 32 30 40C38 32 46 42 30 54Z"/>'};

let step=0,D={},tab='home',msg='',ld=today(),ldAuto=true,openD=null,planOpen=false;

  if(step==3){const x=bmi(D.w,D.h),c=cat(x);b=`<h1>Your BMI</h1><div class="big">${x.toFixed(1)}</div><div class="tag ${c[0]}">${c[0]}</div><p>${c[0]} - ${c[1]}</p>`}

  if(step==7){const r=rateOf(D,D.pace),wk=D.kg/r,gw=D.goal=='loss'?D.w-D.kg:D.w+D.kg;
    b=`<h1>Your plan, ${esc(D.name)}</h1><div class="card"><p>Goal weight: <b>${gw.toFixed(1)} kg</b></p><p>Weekly target: <b>${D.goal=='loss'?'lose':'gain'} ${r} kg/week</b></p><p>Estimated time: <b>${Math.ceil(wk*7)} days (${wk.toFixed(1)} weeks)</b></p><p>Experience: <b>${D.level}</b></p><p>Daily step goal: <b>${stepGoal({...D,w0:D.w}).toLocaleString()} steps</b></p></div>`}
  $('#app').innerHTML=`<div class="wrap" style="padding-top:28px"><div class="dots">${[0,1,2,3,4,5,6,7].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${b}${msg?`<p class="err">${msg}</p>`:''}<div class="row" style="margin-top:18px">${step>0?'<button class="ghost" onclick="msg=\'\';step--;wiz()">Back</button>':''}<button onclick="${step==7?'finish()':'next()'}">${step==7?'Start tracking':'Next'}</button></div></div>`;
  const f=$('#f0')||$('#f2');if(f)f.focus();
}
function next(){
  msg='';
  if(step==0){D.name=$('#f0').value.trim();if(!D.name)return err('Enter your name.')}
  if(step==1&&!D.gender)return err('Pick one option.');
  if(step==2){D.w=+$('#f2').value;D.h=+$('#f3').value;D.age=+$('#f6').value;if(!(D.w>=30&&D.w<=300&&D.h>=100&&D.h<=250&&D.age>=14&&D.age<=90))return err('Enter a weight of 30-300 kg, a height of 100-250 cm and an age of 14-90.')}
  if(step==4){keep();if(!D.goal)return err('Choose a goal.');if(!(D.kg>0&&D.kg<=60))return err('Enter an amount between 0.5 and 60 kg.');
    const gb=bmi(D.goal=='loss'?D.w-D.kg:D.w+D.kg,D.h);
    if(D.goal=='loss'&&(bmi(D.w,D.h)<18.5||gb<18.5))return err('That goal would put you in the underweight BMI range. Try a smaller amount.');

}
function finish(){
  S.p={name:D.name,gender:D.gender,w0:D.w,h:D.h,goal:D.goal,kg:D.kg,pace:D.pace,level:D.level,age:D.age,rate:rateOf(D,D.pace),start:today()};
  if(D.level=='Beginner'){S.plan={n:3,s:JSON.parse(JSON.stringify(PLANS.Beginner))};openD=null}
  save();tab='home';app();
}

const wLogs=()=>Object.keys(S.logs).filter(d=>d>=S.p.start&&S.logs[d].w).sort().map(d=>({d,w:S.logs[d].w}));
const curW=()=>{const l=wLogs();return l.length?l[l.length-1].w:S.p.w0};
const goalW=()=>S.p.goal=='loss'?S.p.w0-S.p.kg:S.p.w0+S.p.kg;
const progress=()=>Math.max(0,Math.min(1,(S.p.goal=='loss'?S.p.w0-curW():curW()-S.p.w0)/S.p.kg));
const wkOn=d=>S.wk.some(x=>x.d==d);
const hasLog=d=>wkOn(d)||(S.logs[d]&&(S.logs[d].steps||S.logs[d].km||S.logs[d].w||S.logs[d].gym||S.logs[d].sleep||S.logs[d].water));

function streak(f){let d=today(),n=0;if(!f(d))d=addDays(d,-1);while(f(d)){n++;d=addDays(d,-1)}return n}
function weekRange(){const t=today(),i=(new Date().getDay()+6)%7,s=addDays(t,-i);return[s,addDays(s,6)]}
const fmtMin=m=>m?(Math.floor(m/60)?Math.floor(m/60)+'h ':'')+(m%60)+'m':'-';

function chart(){
const pts=[{d:S.p.start,w:S.p.w0},...wLogs()],g=goalW();
  const t=d=>(new Date(d)-new Date(S.p.start))/864e5,maxT=Math.max(1,t(pts[pts.length-1].d));
  const ws=pts.map(p=>p.w).concat(g),lo=Math.min(...ws)-1,hi=Math.max(...ws)+1;
  const X=d=>40+(t(d)/maxT)*548,Y=w=>12+(1-(w-lo)/(hi-lo))*184;
  return `<svg viewBox="0 0 600 220" role="img" aria-label="Weight over time"><line x1="40" x2="588" y1="${Y(g)}" y2="${Y(g)}" stroke="#ff7a1a" stroke-dasharray="5 4"/><text x="44" y="${Y(g)-5}" fill="#ff7a1a" font-size="11">goal ${g.toFixed(1)}</text><polyline fill="none" stroke="#b6ff3b" stroke-width="3" points="${pts.map(p=>X(p.d)+','+Y(p.w)).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="4" fill="#b6ff3b"/>`).join('')}<text x="2" y="${Y(hi-1)+4}" fill="#8a949e" font-size="11">${(hi-1).toFixed(0)}</text><text x="2" y="${Y(lo+1)+4}" fill="#8a949e" font-size="11">${(lo+1).toFixed(0)}</text><text x="40" y="214" fill="#8a949e" font-size="11">${S.p.start}</text><text x="588" y="214" text-anchor="end" fill="#8a949e" font-size="11">${pts[pts.length-1].d}</text></svg>`;
}

/* timer */
const tfmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

const bests=()=>{const b={};S.wk.forEach(x=>{if(x.kg&&(!b[x.e]||x.kg>b[x.e].kg))b[x.e]={kg:x.kg,d:x.d}});return Object.entries(b).sort((a,b)=>b[1].kg-a[1].kg)};

function genPlan(a){
  const d=a.d,full=[['Chest','Back','Legs','Core'],['Shoulders','Biceps','Triceps','Legs'],['Chest','Back','Legs','Cardio']],ul=[['Chest','Back','Shoulders','Biceps','Triceps'],['Legs','Core'],['Chest','Back','Shoulders','Biceps','Triceps'],['Legs','Cardio']],ppl=[['Chest','Shoulders','Triceps'],['Back','Biceps','Core'],['Legs','Core']];
  let T,nm;

  else if(d==3){if(a.l=='Beginner'){T=full;nm='full-body'}else{T=ppl;nm='Push/Pull/Legs'}}

  if(a.f=='Fat loss'){let c=0;T.forEach(x=>{if(c<3&&!x.includes('Cardio')){x.push('Cardio');c++}})}
  if(a.f=='Upper body')T.forEach(x=>{if(!x.includes('Legs')&&!x.includes('Shoulders'))x.push('Shoulders')});

  return{n:d,s:sc,E,why:`${d} days a week suits a ${nm} split for a ${a.l.toLowerCase()} lifter. ${a.f=='Fat loss'?'Cardio is added on up to 3 days. ':a.f=='Upper body'?'Extra shoulder work is added. ':a.f=='Lower body'?'An extra leg day is added where possible. ':''}About ${E} exercises per session fits ${a.t} minutes, with ${7-d} rest day${7-d>1?'s':''}.`};

    return `<div class="ex ${d?'dn':''}"><span class="dot ${d?'on':''}">${d?'&#10003;':''}</span><div class="ec2"><div class="eh">${icon(i.m,'#6cc4ff')}<div><b>${esc(i.e)}</b><div style="margin-top:4px"><span class="bd sc">${i.m}</span> <span class="m small">${esc(x.h||'')} - ${x.eq||''}</span></div></div><button class="ghost sm" onclick="rmItem(${i.id})">Remove</button></div>
    <table><tr><th>Set</th><th>${c?'Min':'Reps'}</th><th>Weight</th></tr>${i.sets.map((z,k)=>`<tr class="${z.done?'ok':''}"><td>${k+1}</td><td>${z.r}</td><td>${z.kg?z.kg+' KG':'-'}</td></tr>`).join('')}</table>
    ${d?'<p class="ok" style="margin-top:6px"><b>Completed</b></p>':`<button style="width:100%;margin-top:8px" onclick="startEx(${i.id})">Start Now</button>`}</div></div>`};
  return `<h1>Today's Workout</h1><p class="m small" style="margin-bottom:10px">${DAYS[ti]} - ${pm.length?'Plan: '+pm.join(' + '):'Rest day in your plan. Add a muscle below to train anyway.'}</p>
  <div class="card"><b>${dn} of ${its.length} exercises done</b><div class="bar"><b style="width:${its.length?dn/its.length*100:0}%"></b></div></div>
  ${!its.length&&!pm.length?`<div class="card"><h2>No workout yet</h2><p class="m" style="margin-bottom:10px">Set up your weekly plan and your workout will be ready each day.</p><button onclick="go('plan')">Set up my plan</button></div>`:''}
  <div class="card"><div class="li" style="border:0;padding:0"><div><div class="m small">Rest timer</div><div class="tm tdisp" style="text-align:left;font-size:2.4rem">1:30</div></div><div class="row" style="flex:none;max-width:230px"><button class="ghost sm" onclick="tset(60)">60s</button><button class="ghost sm" onclick="tset(90)">90s</button><button class="ghost sm" onclick="tset(120)">120s</button><button class="ghost sm" onclick="tadd()">+30s</button><button class="sm tpp" onclick="tpp()">Resume</button><button class="ghost sm" onclick="trst()">Reset</button></div></div></div>
  ${secs.map(m=>`<div class="sh"><b>${m.toUpperCase()}</b><button class="ghost sm" onclick="pickM('${m}')">+ Add</button><button class="ghost sm sp" onclick="togSec('${m}')">${gcol[m]?'Show':'Hide'}</button></div>${gcol[m]?'':`<div class="tl">${its.filter(i=>i.m==m).map(card).join('')}</div>`}`).join('')}
  <div class="card"><h2>Add a muscle group</h2><div>${MUSC.filter(m=>!secs.includes(m)).map(m=>`<button class="chip" onclick="pickM('${m}')">${m}</button>`).join('')||'<p class="m">All muscle groups are in your workout.</p>'}</div></div>
  ${acc('stats','Stats and personal bests',`<div class="grid"><div><div class="m small">Session volume</div><div class="streak">${vol.toLocaleString()} kg</div></div><div><div class="m small">Sets today</div><div class="streak">${sets}</div></div></div><h2 style="margin-top:14px">Personal bests</h2>${bl.length?bl.map(([e,v])=>`<div class="li"><span>${esc(e)}</span><span><b class="ok">${v.kg} kg</b> <span class="m small">${v.d}</span></span></div>`).join(''):'<p class="m">Complete a weighted set to see your bests.</p>'}<button class="ghost" style="margin-top:10px" onclick="shareM()">Share card</button>`,vol.toLocaleString()+' kg volume, '+sets+' sets today')}
  <div style="height:80px"></div><div class="fix"><button onclick="completeAll()">Complete All</button></div>`;
}
/* PROFILE */
function setPref(){
  const n=id=>+($(id)||{}).value||0;
  if(n('#s1')>=14&&n('#s1')<=90)S.p.age=n('#s1');
  S.sleepGoal=Math.min(12,Math.max(4,n('#s2')||8));S.waterGoal=Math.min(8000,Math.max(500,n('#s3')||3000));S.act=+$('#s4').value||1.375;
  save();toast('Preferences saved');app();
}
function exportD(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='fittrack-backup-'+today()+'.json';a.click();toast('Backup downloaded')}catch(e){toast('Download failed')}}
function importD(){
  try{const d=JSON.parse($('#imp').value);if(!d||typeof d!='object'||!d.logs||!Array.isArray(d.wk))throw 0;S=Object.assign({p:null,logs:{},wk:[],plan:{n:0,s:{}},mode:'steps',prot:'med',sleepGoal:8,waterGoal:3000,act:1.375},d);save();openD=null;tab='home';toast('Backup restored');S.p?app():wiz()}catch(e){alert('That does not look like a FitTrack backup.')}
}
function resetM(){openM(`<h2>Reset everything?</h2><p class="m" style="margin:8px 0 14px">This permanently deletes your profile, logs and workouts from this browser. Download a backup first if you want to keep them.</p><div class="row"><button class="ghost" onclick="closeM()">Cancel</button><button style="background:var(--r)" onclick="try{localStorage.removeItem(KEY)}catch(e){}location.reload()">Delete all</button></div>`)}
function more(){
  const p=S.p,cw=curW();
  return `<h1>Profile</h1><div class="grid"><div class="card"><div class="m small">Logging streak</div><div class="streak">${streak(hasLog)} days</div></div><div class="card"><div class="m small">Gym streak</div><div class="streak">${streak(hasGym)} days</div></div></div>
  <div class="card"><p><b>${esc(p.name)}</b> - ${p.gender}${p.age?', '+p.age+' yrs':''}, ${p.h} cm${p.level?' - '+p.level:''}</p><p class="m">Start ${p.w0} kg - Now ${cw.toFixed(1)} kg - Goal ${goalW().toFixed(1)} kg</p><p class="m">${p.goal=='loss'?'Lose':'Gain'} ${p.rate} kg/week (${PN[p.pace]})</p></div>
  <div class="card"><h2>Preferences</h2><div class="row" style="margin-bottom:10px"><button class="chip ${S.mode!='km'?'on':''}" onclick="setMode('steps')">Steps</button><button class="chip ${S.mode=='km'?'on':''}" onclick="setMode('km')">Kilometers</button></div>
  <div class="grid"><label>Age<input id="s1" type="number" value="${p.age||''}"></label><label>Sleep goal (hours)<input id="s2" type="number" step="0.5" value="${S.sleepGoal}"></label><label>Water target (ml)<input id="s3" type="number" step="100" value="${S.waterGoal}"></label><label>Activity level<select id="s4">${[[1.2,'Sedentary'],[1.375,'Light (1-3 days/week)'],[1.55,'Moderate (3-5 days/week)'],[1.725,'Very active (6-7 days/week)']].map(([v,t])=>`<option value="${v}" ${S.act==v?'selected':''}>${t}</option>`).join('')}</select></label></div><button onclick="setPref()">Save preferences</button></div>
  <div class="card"><h2>Backup and restore</h2><button class="ghost" onclick="exportD()">Download backup (JSON)</button><label style="margin-top:12px">Paste a backup to restore<textarea id="imp" placeholder="Paste backup JSON here"></textarea></label><button onclick="importD()">Import backup</button></div>
  <div class="card"><h2>Factory reset</h2><button class="ghost" onclick="resetM()">Reset everything</button></div>`;
}

let lastDay=today();
function dayCheck(){if(today()!=lastDay){lastDay=today();if(ldAuto)ld=today();if(S.p)app()}}
setInterval(dayCheck,60000);document.addEventListener('visibilitychange',dayCheck);

S.p?app():wiz();
</script>
</body>
</html>
