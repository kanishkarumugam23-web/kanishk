<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1013">
<title>FitTrack</title>
<style>
:root{--bg:#0e1013;--card:#181c21;--line:#272d34;--tx:#e8ecef;--mu:#8a949e;--g:#b6ff3b;--o:#ff7a1a;--r:#ff5d5d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.7rem;margin-bottom:6px}h2{font-size:1.05rem;margin-bottom:10px}
.m{color:var(--mu)}.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
input,select{width:100%;background:#10141a;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit;margin:6px 0 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
label{display:block;color:var(--mu);font-size:.9rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:var(--g);color:#0b1000;font-weight:700}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
button.sm{padding:5px 10px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.opt{background:var(--card);color:var(--tx);border:2px solid var(--line);text-align:left;padding:14px}
.opt.sel{border-color:var(--g)}.opt:disabled{opacity:.4;cursor:not-allowed}
.dots{display:flex;gap:6px;margin-bottom:22px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dots i.on{background:var(--g)}
.big{font-size:3.2rem;font-weight:800;line-height:1.1}
.tag{display:inline-block;padding:3px 12px;border-radius:20px;font-weight:700;margin:6px 0;background:#2a3037}
.Underweight{color:#6cc4ff}.Normal{color:var(--g)}.Overweight{color:var(--o)}.Obese{color:var(--r)}
.err{color:var(--r);margin:8px 0}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:var(--g);border-radius:6px}
.bar.o b{background:var(--o)}
.nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.nav .wrap{display:flex;gap:6px;align-items:center;padding:10px 16px}
.nav button{background:transparent;color:var(--mu);padding:8px 12px}.nav button.on{background:var(--card);color:var(--g)}
.nav span{margin-right:auto;font-weight:800;color:var(--g)}
.streak{font-size:2.2rem;font-weight:800;color:var(--o)}
.chip{display:inline-block;padding:7px 14px;margin:0 6px 8px 0;border:1px solid var(--line);border-radius:20px;background:transparent;color:var(--tx);font-weight:500}
.chip.on{background:var(--g);color:#0b1000;border-color:var(--g);font-weight:700}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.ok{color:var(--g)}.sc{color:#6cc4ff}.no{color:var(--r)}
svg{width:100%;height:auto;display:block}
.rf{transition:stroke-dashoffset 1.4s ease-out}.ring{width:130px;height:130px;flex:none}.rc{display:flex;gap:18px;align-items:center}
details{border-bottom:1px solid var(--line)}details:last-of-type{border:0}
summary{cursor:pointer;display:flex;gap:8px;padding:12px 0;list-style:none}summary::-webkit-details-marker{display:none}
summary span{margin-left:auto}summary::after{content:"+";color:var(--g);font-weight:800}details[open] summary::after{content:"-"}
details>div{padding-bottom:6px}
.acc{padding:0}.acc>.ah{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;color:var(--tx);padding:16px;border-radius:14px;text-align:left;font-weight:400}
.acc>.ah::after{content:"+";color:var(--g);font-weight:800;font-size:1.4rem}.acc.open>.ah::after{content:"-"}
.acw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.acc.open .acw{grid-template-rows:1fr}
.acw>div{overflow:hidden;min-height:0}.acw>div>div{padding:0 16px 16px}
.wb{padding:8px 0;border-bottom:1px solid var(--line)}.wbt{display:flex;justify-content:space-between;gap:8px}
.wbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.wbar b{display:block;height:100%;background:var(--o);border-radius:6px}.wbar b.d{background:var(--g)}
.vl{display:inline-block;margin:0 10px 10px 0;padding:11px 18px;border:1px solid var(--line);border-radius:10px;color:var(--g);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='fittrack_v1';
let S=Object.assign({p:null,logs:{},wk:[],plan:{n:0,s:{}},mode:'steps',prot:'med',sleepGoal:8},JSON.parse(localStorage.getItem(KEY)||'null')||{});
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)};
const bmi=(w,h)=>w/((h/100)**2);
const cat=b=>b<18.5?['Underweight',"Let's build up strength safely!"]:b<25?['Normal','Great job!']:b<30?['Overweight',"Let's work on a healthy plan!"]:['Obese',"Let's start a steady, healthy plan!"];
const PACE={loss:{slow:.25,mid:.5,fast:1},gain:{slow:.25,mid:.35,fast:.5}};
const PN={slow:'Slow (Safe & Sustainable)',mid:'Mid (Balanced)',fast:'Fast (Aggressive)'};
const MUSC=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Core','Cardio'];
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const EX={Chest:['Bench Press','Incline Bench Press','Decline Bench Press','Dumbbell Press','Incline Dumbbell Press','Dumbbell Fly','Cable Fly','Chest Dips','Push-ups','Machine Chest Press','Pec Deck'],
Back:['Pull-ups','Chin-ups','Lat Pulldown','Seated Cable Row','Barbell Row','One-Arm Dumbbell Row','T-Bar Row','Deadlift','Straight-Arm Pulldown','Back Extension'],
Shoulders:['Overhead Press','Dumbbell Shoulder Press','Arnold Press','Lateral Raise','Front Raise','Rear Delt Fly','Face Pull','Upright Row','Dumbbell Shrugs'],
Biceps:['Barbell Curl','Dumbbell Curl','Hammer Curl','Preacher Curl','Concentration Curl','Incline Dumbbell Curl','Cable Curl','Reverse Curl'],
Triceps:['Triceps Pushdown','Skull Crushers','Overhead Triceps Extension','Close-Grip Bench Press','Bench Dips','Triceps Kickback','Diamond Push-ups'],
Legs:['Squat','Front Squat','Leg Press','Hack Squat','Walking Lunges','Bulgarian Split Squat','Leg Extension','Leg Curl','Romanian Deadlift','Hip Thrust','Calf Raise','Step-ups'],
Core:['Plank','Side Plank','Crunches','Bicycle Crunch','Hanging Leg Raise','Cable Crunch','Russian Twist','Ab Wheel Rollout','Mountain Climbers'],
Cardio:['Treadmill Run','Brisk Walk','Cycling','Rowing Machine','Jump Rope','Stair Climber','Elliptical','Swimming','HIIT Circuit']};
const vid=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' exercise animation proper form');
const PL={low:[1.2,1.5],med:[1.6,1.9],high:[2,2.2]};
function protein(p,w,l){const h=p.h/100,ideal=25*h*h,base=bmi(w,p.h)>=30?ideal+.25*(w-ideal):w,r=PL[l]||PL.med;return[Math.round(base*r[0]),Math.round(base*r[1])]}
const fmtH=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h '+m%60+'m'};
function gymMin(p,b){const c=cat(b)[0],m={Underweight:[45,'Short, heavy lifting sessions. Go easy on cardio.'],Normal:[45,'A balanced mix of weights and cardio.'],Overweight:[50,'Weights, then 10-15 min of cardio.'],Obese:[30,'Start with low-impact moves and build up to 45 min over a few weeks.']}[c];return{min:m[0]+(p.pace=='fast'&&p.goal=='loss'&&c!='Obese'?10:0),note:m[1]}}
const PLANS={Beginner:{0:['Chest','Triceps','Core'],2:['Back','Biceps','Cardio'],4:['Legs','Shoulders','Core']},
Intermediate:{0:['Chest','Triceps'],1:['Back','Biceps'],3:['Legs','Core'],4:['Shoulders','Cardio']},
Pro:{0:['Chest','Shoulders','Triceps'],1:['Back','Biceps'],2:['Legs','Core'],3:['Chest','Shoulders','Triceps'],4:['Back','Biceps'],5:['Legs','Core']}};
const BEGEX={Chest:[['Push-ups',3,'8-10'],['Dumbbell Press',3,'10']],Triceps:[['Bench Dips',2,'10']],Core:[['Plank',3,'20-30 sec'],['Crunches',2,'12']],Back:[['Lat Pulldown',3,'10'],['Seated Cable Row',3,'10']],Biceps:[['Dumbbell Curl',2,'10-12']],Cardio:[['Brisk Walk',1,'15 min']],Legs:[['Squat',3,'10'],['Leg Press',3,'10'],['Calf Raise',2,'12']],Shoulders:[['Dumbbell Shoulder Press',3,'10'],['Lateral Raise',2,'12']]};
const rateOf=(d,k)=>Math.round(Math.min(PACE[d.goal][k],d.w*.01)*100)/100;
const stepGoal=p=>{let s=p.goal=='loss'?{slow:8000,mid:10000,fast:12000}[p.pace]:7000;if(p.level=='Beginner')s=Math.min(s,8000);return p.w0&&bmi(p.w0,p.h)>=30?Math.min(s,8000):s};

let step=0,D={},tab='home',msg='',ld=today(),ldAuto=true,openD=null,planOpen=false;

/* ---------- ONBOARDING ---------- */
function keep(){const e=$('#f4');if(e)D.kg=+e.value}
function err(m){msg=m;wiz()}
function wiz(){
  let b='';
  if(step==0)b=`<h1>Welcome to FitTrack</h1><p class="m">What should we call you?</p><input id="f0" value="${esc(D.name||'')}" placeholder="Your name" maxlength="30">`;
  if(step==1)b=`<h1>Select your gender</h1><p class="m">Pick one to continue.</p><div class="row">${['Male','Female'].map(g=>`<button class="opt ${D.gender==g?'sel':''}" onclick="D.gender='${g}';wiz()">${g}</button>`).join('')}</div>`;
  if(step==2)b=`<h1>Your measurements</h1><label>Weight (kg)<input id="f2" type="number" step="0.1" value="${D.w||''}"></label><label>Height (cm)<input id="f3" type="number" value="${D.h||''}"></label>`;
  if(step==3){const x=bmi(D.w,D.h),c=cat(x);b=`<h1>Your BMI</h1><div class="big">${x.toFixed(1)}</div><div class="tag ${c[0]}">${c[0]}</div><p>${c[0]} - ${c[1]}</p>`}
  if(step==4)b=`<h1>Your main goal</h1><div class="row">${[['loss','Weight Loss'],['gain','Weight Gain']].map(([k,t])=>`<button class="opt ${D.goal==k?'sel':''}" onclick="keep();D.goal='${k}';wiz()">${t}</button>`).join('')}</div>${D.goal?`<label style="margin-top:14px">How many kg do you want to ${D.goal=='loss'?'lose':'gain'}?<input id="f4" type="number" step="0.5" value="${D.kg||''}"></label>`:''}`;
  if(step==5){const lowBmi=D.goal=='loss'&&bmi(D.w,D.h)<25;
    b=`<h1>Choose your pace</h1><p class="m">Weekly change is capped at a safe level for your body weight.</p>${['slow','mid','fast'].map(k=>{const r=rateOf(D,k),off=k=='fast'&&lowBmi;return `<button class="opt ${D.pace==k?'sel':''}" style="width:100%;margin-bottom:10px" ${off?'disabled':''} onclick="D.pace='${k}';wiz()"><b>${PN[k]}</b><br><span class="m small">${r} kg per week - about ${Math.ceil(D.kg/r)} weeks${off?' - not available at your BMI':''}</span></button>`}).join('')}`}
  if(step==6)b=`<h1>Your experience level</h1><p class="m">We tailor your workout guidance to this.</p>${[['Beginner','New to the gym. We build your first weekly plan for you.'],['Intermediate','Training regularly. Customize your own plan.'],['Pro','Years of training. Full control, with optional split suggestions.']].map(([k,t])=>`<button class="opt ${D.level==k?'sel':''}" style="width:100%;margin-bottom:10px" onclick="D.level='${k}';wiz()"><b>${k}</b><br><span class="m small">${t}</span></button>`).join('')}`;
  if(step==7){const r=rateOf(D,D.pace),wk=D.kg/r,gw=D.goal=='loss'?D.w-D.kg:D.w+D.kg;
    b=`<h1>Your plan, ${esc(D.name)}</h1><div class="card"><p>Goal weight: <b>${gw.toFixed(1)} kg</b></p><p>Weekly target: <b>${D.goal=='loss'?'lose':'gain'} ${r} kg/week</b></p><p>Estimated time: <b>${Math.ceil(wk*7)} days (${wk.toFixed(1)} weeks)</b></p><p>Experience: <b>${D.level}</b></p><p>Daily step goal: <b>${stepGoal({...D,w0:D.w}).toLocaleString()} steps</b></p></div>`}
  $('#app').innerHTML=`<div class="wrap" style="padding-top:28px"><div class="dots">${[0,1,2,3,4,5,6,7].map(i=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${b}${msg?`<p class="err">${msg}</p>`:''}<div class="row" style="margin-top:18px">${step>0?'<button class="ghost" onclick="msg=\'\';step--;wiz()">Back</button>':''}<button onclick="${step==7?'finish()':'next()'}">${step==7?'Start tracking':'Next'}</button></div></div>`;
  const f=$('#f0')||$('#f2');if(f)f.focus();
}
function next(){
  msg='';
  if(step==0){D.name=$('#f0').value.trim();if(!D.name)return err('Enter your name.')}
  if(step==1&&!D.gender)return err('Pick one option.');
  if(step==2){D.w=+$('#f2').value;D.h=+$('#f3').value;if(!(D.w>=30&&D.w<=300&&D.h>=100&&D.h<=250))return err('Enter a weight of 30-300 kg and a height of 100-250 cm.')}
  if(step==4){keep();if(!D.goal)return err('Choose a goal.');if(!(D.kg>0&&D.kg<=60))return err('Enter an amount between 0.5 and 60 kg.');
    const gb=bmi(D.goal=='loss'?D.w-D.kg:D.w+D.kg,D.h);
    if(D.goal=='loss'&&(bmi(D.w,D.h)<18.5||gb<18.5))return err('That goal would put you in the underweight BMI range. Try a smaller amount.');
    if(D.goal=='gain'&&gb>=30)return err('That goal would put you in the obese BMI range. Try a smaller amount.');
    D.pace=null}
  if(step==5&&!D.pace)return err('Choose a pace.');
  if(step==6&&!D.level)return err('Choose your experience level.');
  step++;wiz();
}
function finish(){
  S.p={name:D.name,gender:D.gender,w0:D.w,h:D.h,goal:D.goal,kg:D.kg,pace:D.pace,level:D.level,rate:rateOf(D,D.pace),start:today()};
  if(D.level=='Beginner'){S.plan={n:3,s:JSON.parse(JSON.stringify(PLANS.Beginner))};openD=null}
  save();tab='home';app();
}

/* ---------- HELPERS ---------- */
const wLogs=()=>Object.keys(S.logs).filter(d=>d>=S.p.start&&S.logs[d].w).sort().map(d=>({d,w:S.logs[d].w}));
const curW=()=>{const l=wLogs();return l.length?l[l.length-1].w:S.p.w0};
const goalW=()=>S.p.goal=='loss'?S.p.w0-S.p.kg:S.p.w0+S.p.kg;
const progress=()=>Math.max(0,Math.min(1,(S.p.goal=='loss'?S.p.w0-curW():curW()-S.p.w0)/S.p.kg));
const wkOn=d=>S.wk.some(x=>x.d==d);
const hasLog=d=>wkOn(d)||(S.logs[d]&&(S.logs[d].steps||S.logs[d].km||S.logs[d].w||S.logs[d].gym||S.logs[d].sleep));
const hasGym=d=>wkOn(d)||(S.logs[d]&&S.logs[d].gym>0);
function streak(f){let d=today(),n=0;if(!f(d))d=addDays(d,-1);while(f(d)){n++;d=addDays(d,-1)}return n}
function weekRange(){const t=today(),i=(new Date().getDay()+6)%7,s=addDays(t,-i);return[s,addDays(s,6)]}
const fmtMin=m=>m?(Math.floor(m/60)?Math.floor(m/60)+'h ':'')+(m%60)+'m':'-';

function chart(){
  const pts=[{d:S.p.start,w:S.p.w0},...wLogs()],g=goalW();
  const t=d=>(new Date(d)-new Date(S.p.start))/864e5,maxT=Math.max(1,t(pts[pts.length-1].d));
  const ws=pts.map(p=>p.w).concat(g),lo=Math.min(...ws)-1,hi=Math.max(...ws)+1;
  const X=d=>40+(t(d)/maxT)*548,Y=w=>12+(1-(w-lo)/(hi-lo))*184;
  return `<svg viewBox="0 0 600 220" role="img" aria-label="Weight over time"><line x1="40" x2="588" y1="${Y(g)}" y2="${Y(g)}" stroke="#ff7a1a" stroke-dasharray="5 4"/><text x="44" y="${Y(g)-5}" fill="#ff7a1a" font-size="11">goal ${g.toFixed(1)}</text><polyline fill="none" stroke="#b6ff3b" stroke-width="3" points="${pts.map(p=>X(p.d)+','+Y(p.w)).join(' ')}"/>${pts.map(p=>`<circle cx="${X(p.d)}" cy="${Y(p.w)}" r="4" fill="#b6ff3b"/>`).join('')}<text x="2" y="${Y(hi-1)+4}" fill="#8a949e" font-size="11">${(hi-1).toFixed(0)}</text><text x="2" y="${Y(lo+1)+4}" fill="#8a949e" font-size="11">${(lo+1).toFixed(0)}</text><text x="40" y="214" fill="#8a949e" font-size="11">${S.p.start}</text><text x="588" y="214" text-anchor="end" fill="#8a949e" font-size="11">${pts[pts.length-1].d}</text></svg>`;
}

/* ---------- MAIN APP ---------- */
function app(){
  if(ldAuto)ld=today();
  const tabs=[['home','Home'],['log','Daily log'],['gym','Gym'],['more','Profile']];
  $('#app').innerHTML=`<div class="nav"><div class="wrap"><span>FitTrack</span>${tabs.map(([k,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';app()">${t}</button>`).join('')}</div></div><div class="wrap">${{home:home,log:logTab,gym:gymTab,more:more}[tab]()}</div>`;
  setTimeout(()=>document.querySelectorAll('.rf').forEach(c=>{const C=+c.getAttribute('stroke-dasharray');c.style.strokeDashoffset=C*(1-c.dataset.p)}),60);
}
function home(){
  const p=S.p,cw=curW(),b=bmi(cw,p.h),c=cat(b),pr=progress(),left=p.kg*(1-pr),days=Math.ceil(left/p.rate*7);
  const tl=S.logs[today()]||{},sg=stepGoal({...p,w0:p.w0}),km=S.mode=='km',val=km?(tl.km||0):(tl.steps||0),goal=km?Math.round(sg/130)/10:sg,sp=Math.min(1,val/goal),pt=protein(p,cw,S.prot),gt=gymMin(p,b),gp=Math.min(1,(tl.gym||0)/gt.min);
  const sl=tl.sleep||0,rem=Math.max(0,S.sleepGoal-sl),C=2*Math.PI*54;
  return `<h1>Hi, ${esc(p.name)}</h1><p class="m" style="margin-bottom:14px">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})} - ${p.goal=='loss'?'Lose':'Gain'} ${p.rate} kg/week - ${pr>=1?'goal reached!':days+' days to go'}</p>
  <div class="grid"><div class="card"><div class="m small">Current weight</div><div class="big">${cw.toFixed(1)}<span class="m" style="font-size:1rem"> kg</span></div></div>
  <div class="card"><div class="m small">BMI</div><div class="big">${b.toFixed(1)}</div><span class="tag ${c[0]}">${c[0]}</span></div></div>
  ${begCard()}
  <div class="card rc"><svg class="ring" viewBox="0 0 130 130" role="img" aria-label="Goal progress"><circle cx="65" cy="65" r="54" fill="none" stroke="#272d34" stroke-width="12"/><circle class="rf" data-p="${pr}" cx="65" cy="65" r="54" fill="none" stroke="#b6ff3b" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 65 65)"/><text x="65" y="73" text-anchor="middle" fill="#e8ecef" font-size="26" font-weight="800">${Math.round(pr*100)}%</text></svg>
  <div><h2>Goal progress</h2><p class="m">${p.w0} kg to ${goalW().toFixed(1)} kg</p><p>${pr>=1?'Goal reached!':left.toFixed(1)+' kg to go'}</p></div></div>
  <div class="grid"><div class="card"><div class="m small">Logging streak</div><div class="streak">${streak(hasLog)} days</div></div>
  <div class="card"><div class="m small">Gym streak</div><div class="streak">${streak(hasGym)} days</div></div></div>
  <div class="card"><h2>Today's ${km?'distance':'steps'}: ${km?val+' km':val.toLocaleString()} / ${km?goal+' km':goal.toLocaleString()}</h2><div class="bar o"><b style="width:${sp*100}%"></b></div></div>
  <div class="grid"><div class="card"><div class="m small">Daily protein target</div><div class="row" style="margin:8px 0 4px">${[['low','Low'],['med','Medium'],['high','High']].map(([k,t])=>`<button class="chip ${S.prot==k?'on':''}" onclick="setProt('${k}')">${t}</button>`).join('')}</div><div class="big">${pt[0]}-${pt[1]}<span class="m" style="font-size:1rem"> g</span></div><p class="m small">Based on your weight (${cw.toFixed(1)} kg) and height (${p.h} cm). General guidance only. Check with a doctor if you have kidney problems.</p></div>
  <div class="card"><div class="m small">Minimum gym time</div><div class="big">${gt.min}<span class="m" style="font-size:1rem"> min</span></div><p class="m small">per session. ${gt.note}</p><div class="bar o"><b style="width:${gp*100}%"></b></div><span class="m small">Today: ${fmtMin(tl.gym)}</span></div></div>
  <div class="card"><h2>Sleep</h2><div class="bar"><b style="width:${Math.min(100,sl/S.sleepGoal*100)}%"></b></div><p>${sl?`${fmtH(sl)} of ${fmtH(S.sleepGoal)}. ${rem>0?fmtH(rem)+' more to reach your goal.':'Sleep goal reached!'}`:`Goal: ${fmtH(S.sleepGoal)}. Log last night's sleep in the Daily log.`}</p></div>
  <div class="card"><h2>Weight over time</h2>${chart()}</div>`;
}
function logTab(){
  const l=S.logs[ld]||{},gm=l.gym||0,sl=l.sleep||0,rem=Math.max(0,S.sleepGoal-sl);
  const recent=Object.keys(S.logs).sort().reverse().slice(0,7);
  return `<h1>Daily log</h1><div class="card"><label>Date<input type="date" value="${ld}" max="${today()}" onchange="setLd(this.value)"></label>${ldAuto?'<p class="m small" style="margin-bottom:12px">Showing today. This updates automatically each day.</p>':'<button class="ghost sm" style="margin-bottom:12px" onclick="setLd(today())">Back to today</button>'}
  <p class="m small" style="margin-bottom:12px">Recommended: ${S.mode=='km'?(stepGoal({...S.p})/1300).toFixed(1)+' km':stepGoal({...S.p}).toLocaleString()+' steps'} a day.</p>
  <div class="row" style="margin-bottom:10px"><button class="chip ${S.mode!='km'?'on':''}" onclick="setMode('steps')">Steps</button><button class="chip ${S.mode=='km'?'on':''}" onclick="setMode('km')">Run / walk distance</button></div>
  <div class="grid">${S.mode=='km'?`<label>Distance (km)<input id="l2" type="number" step="0.1" min="0" value="${l.km||''}"></label>`:`<label>Steps<input id="l1" type="number" min="0" value="${l.steps||''}"></label>`}
  <label>Weight check-in (kg)<input id="l3" type="number" step="0.1" value="${l.w||''}"></label>
  <div class="row"><label>Gym hours<input id="l4" type="number" min="0" value="${gm?Math.floor(gm/60):''}"></label><label>Minutes<input id="l5" type="number" min="0" max="59" value="${gm?gm%60:''}"></label></div>
  <div class="row"><label>Hours slept<input id="l6" type="number" step="0.25" min="0" max="24" value="${sl||''}"></label><label>Sleep goal (hours)<input id="l7" type="number" step="0.5" min="4" max="12" value="${S.sleepGoal}"></label></div></div>
  <p class="${sl&&!rem?'ok':'m'}" style="margin-bottom:12px">${sl?(rem>0?fmtH(rem)+' of sleep left to reach your goal.':'Sleep goal reached!'):'Enter your sleep to see how much is left to reach your goal.'}</p>
  <button onclick="saveLog()">Save log</button></div>
  <div class="card"><h2>Recent days</h2>${recent.length?recent.map(d=>{const x=S.logs[d];return `<div class="li"><span>${d}</span><span class="m small">${x.km&&!x.steps?x.km+' km':(x.steps||0)+' steps'} - ${x.w?x.w+' kg':'no weight'} - gym ${fmtMin(x.gym)} - sleep ${x.sleep?x.sleep+'h':'-'}</span></div>`}).join(''):'<p class="m">Nothing logged yet. Fill in the form above to start your streak.</p>'}</div>`;
}
function setLd(v){ld=v||today();ldAuto=ld==today();app()}
function setProt(k){S.prot=k;save();app()}
function togDay(i,o){o?openD.add(i):openD.delete(i)}
function setMode(m){S.mode=m;save();app()}
function saveLog(){
  const n=id=>+($(id)||{}).value||0,o=S.logs[ld]||{},k=S.mode=='km';
  S.logs[ld]={steps:k?o.steps||0:n('#l1'),km:k?n('#l2'):o.km||0,w:n('#l3'),gym:n('#l4')*60+n('#l5'),sleep:n('#l6')};
  S.sleepGoal=Math.min(12,Math.max(4,n('#l7')||8));
  save();app();
}
function setDays(n){S.plan.n=n;planOpen=false;save();app()}
function todayItems(){const ti=(new Date().getDay()+6)%7,t=today();return(S.plan.s[ti]||[]).flatMap(m=>(BEGEX[m]||[]).map(([e,s,r])=>({m,e,s,r,done:S.wk.some(x=>x.d==t&&x.e==e)})))}
function quick(k){const i=todayItems()[k];S.wk.push({id:Date.now(),d:today(),m:i.m,e:i.e,s:i.s,r:parseInt(i.r)||0,kg:0});save();app()}
function begCard(){
  const p=S.p;if(p.level!='Beginner')return '';
  const ti=(new Date().getDay()+6)%7,tm=S.plan.s[ti]||[],tl=S.logs[today()]||{},km=S.mode=='km',sg=stepGoal({...p}),val=km?(tl.km||0):(tl.steps||0),goal=km?Math.round(sg/130)/10:sg,sp=Math.min(1,val/goal),it=todayItems(),dn=it.filter(i=>i.done).length;
  return `<div class="card" style="border-color:#3b4a1a"><h2>Beginner Daily Target &amp; Workout Chart</h2><p class="m small">${DAYS[ti]}${tm.length?': '+tm.join(' + '):': rest day'}</p>
  <div class="li"><span>Daily step target</span><b>${km?goal+' km':goal.toLocaleString()+' steps'}</b></div><div class="bar o"><b style="width:${sp*100}%"></b></div><p class="m small">Done today: ${km?val+' km':val.toLocaleString()} (${Math.round(sp*100)}%)</p>
  ${it.length?`<h2 style="margin-top:12px">Today's workout: ${dn} of ${it.length} done</h2><div class="bar"><b style="width:${dn/it.length*100}%"></b></div>${it.map((i,k)=>`<div class="wb"><div class="wbt"><span>${esc(i.e)} <span class="m small">${i.m}</span></span><span class="m small">${i.s} sets x ${i.r}</span></div><div class="wbar"><b class="${i.done?'d':''}" style="width:${Math.min(100,i.s*33)}%"></b></div>${i.done?'<span class="ok small">Done</span>':`<button class="ghost sm" onclick="quick(${k})">Mark done</button>`}</div>`).join('')}`:'<p>Rest day. Take an easy walk and stretch.</p>'}</div>`;
}
function suggestPlan(){
  const lv=S.p.level in PLANS?S.p.level:'Intermediate',has=Object.values(S.plan.s).some(a=>a.length);
  if(has&&!confirm('Replace your current weekly plan with the suggested '+lv+' plan? You can still edit it.'))return;
  const t=PLANS[lv];S.plan={n:Object.keys(t).length,s:JSON.parse(JSON.stringify(t))};openD=null;planOpen=true;save();app();
}
function togPlan(){planOpen=!planOpen;const b=$('#planbox');if(b)b.classList.toggle('open',planOpen)}
function tgDay(i,m){const a=S.plan.s[i]=S.plan.s[i]||[],k=a.indexOf(m);k<0?a.push(m):a.splice(k,1);save();app()}
function exOpts(){$('#g6').innerHTML=EX[$('#g2').value].map(e=>`<option>${e}</option>`).join('');vLink()}
function vLink(){$('#vl').href=vid($('#g3').value.trim()||$('#g6').value)}
function gymTab(){
  const pl=S.plan;
  if(!pl.n)return `<h1>Gym</h1><div class="card"><h2>How many days a week will you work out?</h2><div class="row">${[1,2,3,4,5,6,7].map(n=>`<button class="chip" onclick="setDays(${n})">${n}</button>`).join('')}</div>${S.p.level!='Beginner'?'<button class="ghost" style="margin-top:8px" onclick="suggestPlan()">Suggest Workout Plan</button>':''}</div>`;
  const [ws,we]=weekRange(),t=today(),ti=(new Date().getDay()+6)%7,sch=pl.s;
  if(openD===null)openD=new Set([ti]);
  const planned=DAYS.filter((d,i)=>(sch[i]||[]).length).length,need=pl.n-planned;
  const tg=[...new Set(Object.values(sch).flat())].filter(m=>MUSC.includes(m));
  const pv=need>0?`Add ${need} more workout day${need>1?'s':''} to match your ${pl.n}-day plan.`:need<0?`You planned ${-need} day${-need>1?'s':''} too many. Remove ${-need} or raise your days per week.`:`Plan complete: ${pl.n} workout days.`;
  const cov=tg.map(m=>{const tr=S.wk.some(x=>x.m==m&&x.d>=ws&&x.d<=t),nd=DAYS.findIndex((d,i)=>i>=ti&&(sch[i]||[]).includes(m));return tr?[m,'ok','Trained']:nd>=0?[m,'sc','Planned '+DAYS[nd].slice(0,3)]:[m,'no','Missed']});
  const miss=cov.filter(c=>c[1]=='no').length;
  const verdict=!tg.length?'Add muscle groups to your weekly plan.':miss?`${miss} muscle group${miss>1?'s':''} missed this week. Move them to a remaining day.`:'On track: every target muscle is trained or planned this week.';
  const tm=sch[ti]||[],m0=tm[0]||MUSC[0];
  const list=[...S.wk].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,12);
  const best={};S.wk.forEach(x=>{if(x.kg&&(!best[x.e]||x.kg>best[x.e].kg))best[x.e]={kg:x.kg,d:x.d}});
  const bl=Object.entries(best).sort((a,b)=>b[1].kg-a[1].kg);
  return `<h1>Gym</h1>${begCard()}<div class="grid"><div class="card"><div class="m small">Workout streak</div><div class="streak">${streak(hasGym)} days</div></div><div class="card"><div class="m small">Workouts this week</div><div class="streak">${new Set(S.wk.filter(x=>x.d>=ws&&x.d<=t).map(x=>x.d)).size} / ${pl.n}</div></div></div>
  <button class="ghost" style="width:100%;margin-bottom:14px" onclick="suggestPlan()">${S.p.level=='Beginner'?'Reset to beginner plan':'Suggest Workout Plan'}</button>
  <div class="card acc ${planOpen?'open':''}" id="planbox"><button class="ah" onclick="togPlan()"><span><b>Weekly plan: ${pl.n} days</b><br><span class="small ${need?'no':'ok'}">${pv}</span></span></button><div class="acw"><div><div>
  <p class="m small" style="margin-bottom:6px">Tap a day to open it and choose muscles. Leave a day empty for rest.</p>
  ${DAYS.map((d,i)=>`<details ${openD.has(i)?'open':''} ontoggle="togDay(${i},this.open)"><summary><b>${d}${i==ti?' (today)':''}</b><span class="m small">${(sch[i]||[]).join(', ')||'Rest'}</span></summary><div>${MUSC.map(m=>`<button class="chip sm ${(sch[i]||[]).includes(m)?'on':''}" onclick="tgDay(${i},'${m}')">${m}</button>`).join('')}</div></details>`).join('')}
  <div class="row" style="margin-top:12px"><button class="ghost sm" onclick="S.plan.n=0;save();app()">Change days</button></div></div></div></div></div>
  <div class="card"><h2>This week's coverage</h2>${cov.map(c=>`<div class="li"><span>${c[0]}</span><span class="${c[1]}">${c[2]}</span></div>`).join('')}<p style="margin-top:10px"><b>${verdict}</b></p></div>
  <div class="card"><h2>Log an exercise</h2><p class="m small" style="margin-bottom:8px">${tm.length?'Today: '+tm.join(' + '):'Rest day today. You can still log a workout.'}</p>
  <div class="grid"><label>Date<input id="g1" type="date" value="${t}"></label><label>Muscle group<select id="g2" onchange="exOpts()">${MUSC.map(m=>`<option ${m==m0?'selected':''}>${m}</option>`).join('')}</select></label>
  <label>Exercise type<select id="g6" onchange="vLink()">${EX[m0].map(e=>`<option>${e}</option>`).join('')}</select></label><label>Or type your own exercise<input id="g3" maxlength="40" oninput="vLink()"></label>
  <label>Sets<input id="g4" type="number" min="1"></label><label>Reps<input id="g5" type="number" min="1"></label>
  <label>Max weight (kg)<input id="g7" type="number" step="0.5" min="0"></label></div>
  <a id="vl" class="vl" href="${vid(EX[m0][0])}" target="_blank" rel="noopener">Watch animation video</a><button onclick="addEx()">Add exercise</button></div>
  <div class="card"><h2>Personal bests (max weight)</h2>${bl.length?bl.map(([e,v])=>`<div class="li"><span>${esc(e)}</span><span><b class="ok">${v.kg} kg</b> <span class="m small">${v.d}</span></span></div>`).join(''):'<p class="m">Log an exercise with a max weight to see your bests here.</p>'}</div>
  <div class="card"><h2>Exercise guide</h2><p class="m small">Tap an exercise to watch an animated demo.</p>${(tm.length?tm:MUSC).map(m=>`<p style="margin:10px 0 6px"><b>${m}</b></p>${EX[m].map(e=>`<a class="chip" style="text-decoration:none;color:var(--tx)" href="${vid(e)}" target="_blank" rel="noopener">${e}</a>`).join('')}`).join('')}</div>
  <div class="card"><h2>Recent exercises</h2>${list.length?list.map(x=>`<div class="li"><span>${x.d} - <b>${esc(x.m)}</b>: ${esc(x.e)} ${x.s?`<span class="m small">${x.s}x${x.r||'-'}</span>`:''} ${x.kg?`<span class="ok small">max ${x.kg} kg</span>`:''}</span><button class="ghost sm" onclick="delEx(${x.id})">Delete</button></div>`).join(''):'<p class="m">No exercises yet. Add your first one above.</p>'}</div>`;
}
function addEx(){
  const e=$('#g3').value.trim()||$('#g6').value,d=$('#g1').value;
  if(!d)return alert('Pick a date.');
  S.wk.push({id:Date.now(),d,m:$('#g2').value,e,s:+$('#g4').value||0,r:+$('#g5').value||0,kg:+$('#g7').value||0});
  save();app();
}
function delEx(id){S.wk=S.wk.filter(x=>x.id!=id);save();app()}
function more(){
  const p=S.p;
  return `<h1>Profile</h1><div class="grid"><div class="card"><div class="m small">Logging streak</div><div class="streak">${streak(hasLog)} days</div></div><div class="card"><div class="m small">Gym streak</div><div class="streak">${streak(hasGym)} days</div></div></div><div class="card"><p><b>${esc(p.name)}</b> - ${p.gender}, ${p.h} cm${p.level?' - '+p.level:''}</p><p class="m">Start weight ${p.w0} kg - ${p.goal=='loss'?'lose':'gain'} ${p.kg} kg at ${p.rate} kg/week (${PN[p.pace]})</p><p class="m">Started ${p.start}</p></div>
  <div class="card"><h2>Start over</h2><p class="m" style="margin-bottom:10px">This deletes your profile and all logs from this browser.</p><button class="ghost" onclick="if(confirm('Delete all data?')){localStorage.removeItem(KEY);location.reload()}">Reset everything</button></div>`;
}

document.addEventListener('click',e=>{if(planOpen&&!e.target.closest('#planbox')){planOpen=false;const b=$('#planbox');if(b)b.classList.remove('open')}},true);
let lastDay=today();
function dayCheck(){if(today()!=lastDay){lastDay=today();if(ldAuto)ld=today();if(S.p)app()}}
setInterval(dayCheck,60000);document.addEventListener('visibilitychange',dayCheck);

S.p?app():wiz();
</script>
</body>
</html>
